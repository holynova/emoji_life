<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="360" viewBox="0 0 1200 360"
     role="img" aria-labelledby="title desc">
  <title id="title">Emoji 人生轨迹 — 用 emoji 生成你的人生时间线</title>
  <desc id="desc">暖纸底标题：Emoji 人生轨迹，副标题左边是年份，右边只保留 emoji；右侧是一张迷你时间线卡片，1995 出生、2001 读书、2017 毕业、2018 工作、2023 结婚。</desc>

  <g id="bg">
    <rect width="1200" height="360" rx="26" fill="#f8f5ee"/>
  </g>

  <g id="title-block" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
    <text x="56" y="62" font-size="19" letter-spacing="3" fill="#6a6258">单文件网页工具 · SINGLE-FILE WEB APP</text>
    <text x="56" y="130" font-size="62" font-weight="700" fill="#222222">Emoji 人生轨迹</text>
    <text x="56" y="172" font-size="23" fill="#222222">用 emoji 生成你的人生时间线</text>
    <text x="56" y="208" font-size="19" fill="#6a6258">左边是年份，右边只保留 emoji — 极简、可复制、可导出图片。</text>
    <g id="chips" font-size="18" fill="#222222" text-anchor="middle">
      <g><rect x="56" y="238" width="150" height="36" rx="18" fill="#ffffff" stroke="#ddd5c3" stroke-width="1.5"/><text x="131" y="262">8 个固定事件</text></g>
      <g><rect x="218" y="238" width="150" height="36" rx="18" fill="#ffffff" stroke="#ddd5c3" stroke-width="1.5"/><text x="293" y="262">自定义 emoji</text></g>
      <g><rect x="380" y="238" width="150" height="36" rx="18" fill="#ffffff" stroke="#ddd5c3" stroke-width="1.5"/><text x="455" y="262">一键复制/导出</text></g>
    </g>
  </g>

  <g id="timeline-card" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
    <g id="card-bg">
      <rect x="760" y="48" width="384" height="264" rx="18" fill="#ffffff" stroke="#ddd5c3" stroke-width="1.5"/>
    </g>
    <g id="card-title">
      <text x="788" y="84" font-size="17" font-weight="700" fill="#222222">结果预览</text>
      <text x="1116" y="84" font-size="15" fill="#6a6258" text-anchor="end">展开视图</text>
    </g>
    <g id="timeline-line">
      <line x1="800" y1="106" x2="800" y2="288" stroke="#ddd5c3" stroke-width="2"/>
    </g>
    <g id="timeline-rows" font-size="19">
      <circle cx="800" cy="118" r="6" fill="#2e7d4f"/>
      <text x="824" y="125" font-size="18" font-weight="700" fill="#1f1f1f">1995</text>
      <text x="884" y="125" fill="#222222">👶 出生</text>
      <circle cx="800" cy="154" r="6" fill="#2e7d4f"/>
      <text x="824" y="161" font-size="18" font-weight="700" fill="#1f1f1f">2001</text>
      <text x="884" y="161" fill="#222222">👧🏫 读书</text>
      <circle cx="800" cy="190" r="6" fill="#2e7d4f"/>
      <text x="824" y="197" font-size="18" font-weight="700" fill="#1f1f1f">2017</text>
      <text x="884" y="197" fill="#222222">🎓 毕业</text>
      <circle cx="800" cy="226" r="6" fill="#2e7d4f"/>
      <text x="824" y="233" font-size="18" font-weight="700" fill="#1f1f1f">2018</text>
      <text x="884" y="233" fill="#222222">💻 工作</text>
      <circle cx="800" cy="262" r="6" fill="#2e7d4f"/>
      <text x="824" y="269" font-size="18" font-weight="700" fill="#1f1f1f">2023</text>
      <text x="884" y="269" fill="#222222">💍 结婚</text>
    </g>
    <g id="card-footer">
      <text x="788" y="300" font-size="14" fill="#6a6258">折叠连续年份 · 复制纯文本 · 导出 1080px 图片</text>
    </g>
  </g>
</svg>
